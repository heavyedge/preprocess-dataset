name: CI

on:
  push:
  pull_request:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up uv
        uses: astral-sh/setup-uv@v5

      - name: install dependencies
        run: |
          uv pip install --system flake8 "black[jupyter]" isort

      - name: lint with flake8
        run: |
          flake8

      - name: lint with black
        run: |
          black --check .

      - name: lint with isort
        run: |
          isort --check .

  build:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up the environment
        run: ./setup.sh
        env:
          PROFILES_V1_GDRIVE: ${{ secrets.PROFILES_V1_GDRIVE }}
          CA_V1_GDRIVE: ${{ secrets.CA_V1_GDRIVE }}

      - name: build datasets
        run: HEAVYEDGE_TEST_MODE=1 make datasets

      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: _data/v1/profiles/dataset1/001*
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: datasets
          path: |
            datasets/v1/profiles/all_profiles/dataset1.tar.gz
            datasets/v1/profiles/mean_profiles/dataset1.tar.gz
            datasets/v1/contact_angles/*
            datasets/v1/viscosities/*
            datasets/v1/process_variables/mean_profiles/*
          retention-days: 1

  find-notebooks:

      runs-on: ubuntu-latest

      outputs:
        notebooks: ${{ steps.list.outputs.notebooks }}

      steps:

        - name: get repo
          uses: actions/checkout@v3

        - name: list notebooks
          id: list
          run: |
            notebooks=$(find examples -name "*.ipynb" | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "notebooks=$notebooks" >> $GITHUB_OUTPUT

  build-notebooks:

      needs:
        - find-notebooks
        - build

      runs-on: ubuntu-latest

      strategy:
        fail-fast: false
        matrix:
          notebook: ${{ fromJson(needs.find-notebooks.outputs.notebooks) }}

      steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up the environment
        run: pip install -r requirements.txt -r examples/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: datasets
          path: datasets/v1

      - run: HEAVYEDGE_TEST_MODE=1 make ${{ matrix.notebook }}

      - name: run papermill test
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          test_notebook="test/${NOTEBOOK#*/}"
          HEAVYEDGE_TEST_MODE=1 make "$test_notebook"
